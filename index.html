<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 填写全场景 Demo</title>
<style>
:root{
  /* layout: 左侧按真实 query 类型分组的场景 / 中间模拟 WPS 文字窗口 + 简约对话框 / 右侧设计说明 */
  --bg:#ECEEF2; --win:#FFFFFF; --chrome:#F7F8FA; --docbg:#E6E8EC;
  --ink:#1F2329; --ink-2:#4E5969; --ink-3:#5F6670; --ph:#8A9099; --line:#DEE0E3; --line-2:#C4C9D0; --cell:#B8BEC7;
  --accent:#2F6BFF; --accent-ink:#1A4FD6; --accent-bg:#EAF1FF; --accent-line:#8EADFF; --sel:#D5E3FF;
  --ok:#0B7A55; --ok-bg:#E3F5EC; --warn:#9A4A00; --warn-bg:#FFF3E0; --hl:#FFE7A0;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.6}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea{background-color:#FFFFFF;color:var(--ink);font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--ph)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{max-width:1520px;margin:0 auto;padding:18px 20px 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.top h1{font-size:19px;margin:0;font-weight:600}
.top p{margin:0;color:var(--ink-2);font-size:13px}
.top .demo-tag{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:1px 8px;border-radius:4px}

.layout{max-width:1520px;margin:0 auto;padding:0 20px 28px;display:grid;grid-template-columns:236px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1200px){.layout{grid-template-columns:220px minmax(0,1fr)}.notes{grid-column:1/-1}}
@media (max-width:780px){.layout{grid-template-columns:1fr}}

.scen{background:var(--win);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
@media (max-width:780px){.scen{position:static}}
.scen h2{font-size:12px;color:var(--ink-3);font-weight:500;margin:10px 8px 2px;display:flex;justify-content:space-between;gap:6px}
.scen h2:first-child{margin-top:2px}
.scen h2 em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.scen button{text-align:left;border:none;background:none;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:center}
.scen button:hover{background:var(--chrome)}
.scen button[aria-current="true"]{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.scen .n{font-size:11px;color:var(--ink-3);width:16px;flex:none;font-variant-numeric:tabular-nums}
.scen button[aria-current="true"] .n{color:var(--accent-ink)}
.scen .src-note{font-size:11px;color:var(--ink-3);margin:10px 8px 0;line-height:1.5}

.win{background:var(--win);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.tabs{display:flex;align-items:center;gap:4px;background:#E9EBEF;padding:6px 8px 0}
.tab{font-size:12px;padding:6px 14px;border-radius:6px 6px 0 0;color:var(--ink-2);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.tab.on{background:var(--win);color:var(--ink)}
.tab .w{width:14px;height:14px;border-radius:3px;background:#2F6BFF;color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.menu{display:flex;gap:18px;padding:8px 16px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.menu .on{color:var(--accent-ink);font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:2px}
.ribbon{display:flex;align-items:stretch;gap:2px;padding:8px 12px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:56px;padding:4px 6px;font-size:12px;color:var(--ink-2);border-radius:6px;white-space:nowrap}
.rb svg{width:20px;height:20px}
.sep{width:1px;background:var(--line);margin:4px 6px}
.aibtn-wrap{position:relative}
.aibtn{border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:4px 8px;font-size:12px;border-radius:6px;color:var(--ink)}
.aibtn:hover,.aibtn[aria-expanded="true"]{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent-ink)}
.aibtn svg{width:20px;height:20px}
.aibtn .beta{font-size:10px;color:var(--accent-ink);background:var(--accent-bg);border-radius:3px;padding:0 4px;line-height:15px;margin-left:2px}
.tip{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:250px;background:var(--win);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(31,35,41,.12);font-size:12px;color:var(--ink-2);z-index:20;display:none;text-align:left}
.aibtn-wrap:hover .tip{display:block}
.tip b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
@media (max-width:780px){.tip{left:0;transform:none}}

.docbg{background:var(--docbg);padding:24px 16px 40px}
.page{background:var(--win);max-width:780px;margin:0 auto;padding:40px 52px 56px;min-height:620px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (max-width:620px){.page{padding:28px 18px}}
.page h3{font-size:20px;margin:0 0 14px;font-weight:600;text-align:center}
.page h4{font-size:15px;margin:18px 0 8px;font-weight:600}
.page p{margin:0 0 10px;font-size:14px;line-height:1.8}
.page .muted{color:var(--ink-3)}
.src{border-radius:3px;transition:background .15s}
.src.hl{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}

.tblwrap{position:relative;margin:12px 0 0;overflow-x:auto}
table.t{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px;user-select:none}
table.t td{border:1px solid #2B2F36;height:34px;padding:4px 8px;vertical-align:middle;word-break:break-all;line-height:1.5;transition:background .3s;cursor:cell}
table.t td.h{font-weight:600}
table.t td.l{color:var(--ink-2)}
table.t td.big{height:64px;vertical-align:top}
table.t td.tgt{background:var(--accent-bg)}
table.t td.sel{background:var(--sel)}
table.t td.pv{background:#F2F7FF;color:var(--accent-ink)}
table.t td.skel{background:var(--accent-bg);animation:pulse 1s ease-in-out infinite}
table.t td[data-src]{cursor:help}
table.t td .old{display:block;font-size:11px;color:var(--ink-3);text-decoration:line-through}
table.t td.just{animation:flash 1.4s ease-out}
.swap{display:inline-block;margin-left:6px;font-size:11px;border:1px solid var(--accent-line);background:var(--win);color:var(--accent-ink);border-radius:4px;padding:0 6px;line-height:18px;vertical-align:1px}
.swap:hover{background:var(--accent-bg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes flash{0%{background:var(--ok-bg)}100%{background:transparent}}

.inhint{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--accent-line);background:rgba(234,241,255,.94);color:var(--accent-ink);font-size:13px}
.inhint:hover{background:var(--accent-bg)}
.inhint svg,.topchip svg{width:14px;height:14px}
.topchip{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.topchip button{border:1px dashed var(--accent-line);background:var(--accent-bg);color:var(--accent-ink);font-size:13px;padding:5px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
.topchip button.plain{border-style:solid;background:var(--win);color:var(--ink-2)}

/* 简约对话框 */
.dlg-wrap{margin-top:28px;max-width:600px}
.dlg{border:1px solid #E1E3E7;border-radius:22px;background:#FFFFFF;box-shadow:0 6px 24px rgba(31,35,41,.08);padding:14px 14px 10px 18px;transition:border-color .15s,box-shadow .15s}
.dlg:focus-within{border-color:#B9C9F5;box-shadow:0 6px 24px rgba(47,107,255,.10)}
.dlg.pulse{animation:ring .8s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(47,107,255,.40)}100%{box-shadow:0 0 0 10px rgba(47,107,255,0)}}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;max-width:220px;background:#F2F4F7;border-radius:8px;padding:3px 4px 3px 8px;font-size:12px;color:var(--ink-2)}
.pill.selp{background:var(--accent-bg);color:var(--accent-ink)}
.pill img{width:22px;height:22px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.pill .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill button{border:none;background:none;width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex:none}
.pill button:hover{background:rgba(0,0,0,.06)}
.dlg textarea{display:block;width:100%;border:none;outline:none;resize:none;font-size:15px;line-height:1.7;min-height:52px;max-height:220px;background:transparent;color:var(--ink);padding:0}
.dlg textarea:focus-visible{outline:none}
.dlg textarea[readonly]{color:var(--ink-3)}
.tools{display:flex;align-items:center;gap:2px;margin-top:8px}
.ib{position:relative;width:36px;height:36px;border-radius:8px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:#30343A}
.ib:hover{background:#F2F4F7}
.ib svg{width:22px;height:22px}
.ib .tt{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#2B2F36;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;display:none;pointer-events:none}
.ib:hover .tt,.ib:focus-visible .tt{display:block}
.ib.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cnt{font-size:12px;color:var(--ph);margin-left:4px}
.send{margin-left:auto;width:40px;height:40px;border-radius:50%;border:none;background:#E9EBEE;color:#A3A8B0;display:flex;align-items:center;justify-content:center;transition:background .15s}
.send svg{width:20px;height:20px}
.send.on{background:var(--accent);color:#fff}
.send.on:hover{background:var(--accent-ink)}
.send.stop{background:#2B2F36;color:#fff}

.stat{margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--accent-bg);color:var(--accent-ink);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stat.ok{background:var(--ok-bg);color:var(--ok)}
.stat.w{background:var(--warn-bg);color:var(--warn)}
.stat.e{background:#FDECEC;color:#B42318}
.stat.i{background:#F2F4F7;color:var(--ink-2)}
.stat .grow{flex:1;min-width:180px}
.stat .sub{display:block;font-size:12px;opacity:.9}
.stat .bar{flex-basis:100%;height:3px;background:rgba(47,107,255,.15);border-radius:2px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent);transition:width .1s}
.sbtn{border:1px solid currentColor;background:#FFFFFF;color:inherit;padding:3px 12px;border-radius:8px;font-size:12px}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sbtn.pri:hover{background:var(--accent-ink)}
.lnk{border:none;background:none;color:inherit;padding:2px 4px;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.optnote{margin-top:8px;font-size:12px;color:var(--ink-3);display:flex;gap:4px;align-items:center;padding-left:4px}
.optnote .lnk{color:var(--accent-ink)}
.sugg{margin-top:14px}
.sugg .lb{font-size:12px;color:var(--ink-3);margin:0 0 8px 4px}
.sugg .row{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{border:1px solid #E1E3E7;background:#FFFFFF;color:var(--ink);font-size:13px;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;text-align:left}
.sugg button:hover{border-color:var(--accent-line);color:var(--accent-ink);background:#F8FAFF}
.sugg button svg{width:13px;height:13px;color:var(--accent);flex:none}

.notes{background:var(--win);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:12px}
@media (max-width:1200px){.notes{position:static}}
.notes h2{font-size:15px;margin:0 0 10px;font-weight:600}
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps span{flex:1;text-align:center;font-size:11px;padding:4px 0;border-radius:4px;background:var(--chrome);color:var(--ink-3)}
.steps span.done{background:var(--accent-bg);color:var(--accent-ink)}
.steps span.cur{background:var(--accent);color:#fff;font-weight:600}
.steps span.skip{text-decoration:line-through}
.notes dl{margin:0 0 12px;font-size:13px}
.notes dt{font-size:12px;color:var(--ink-3);margin-top:8px}
.notes dd{margin:2px 0 0}
.notes ol{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.notes ol li::marker{color:var(--accent-ink);font-weight:600}
.notes .why{display:block;font-size:12px;color:var(--ink-3)}
.notes .reset{margin-top:14px;border:1px solid var(--line-2);background:var(--win);padding:6px 12px;border-radius:8px;font-size:13px}
.notes .reset:hover{border-color:var(--accent-line);color:var(--accent-ink)}

/* 探索一下 */
.sugg button.ex{border-style:dashed;border-color:#B9C9F5;color:var(--accent-ink);background:#F8FAFF}
.sugg button.ex:hover{background:var(--accent-bg)}
.sugg button.ex svg{width:14px;height:14px}
.explore{margin-top:14px;border:1px solid #E1E3E7;border-radius:16px;background:#FFFFFF;padding:14px 16px 12px;box-shadow:0 4px 16px rgba(31,35,41,.06);outline:none;transform-origin:top center}
.explore.anim{animation:exIn .26s cubic-bezier(.2,.8,.2,1)}
.explore.out{animation:exOut .17s ease-in forwards}
@keyframes exIn{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes exOut{to{opacity:0;transform:translateY(-6px) scale(.985)}}
.exhead{display:flex;align-items:center;gap:8px}
.exhead h3{font-size:13px;margin:0;font-weight:500;color:var(--ink-3);text-align:left}
.exhead .ct{font-size:12px;color:var(--ph);font-variant-numeric:tabular-nums}
.exhead .xb{margin-left:auto;border:none;background:none;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.exhead .xb:hover{background:#F2F4F7}
.exbody.from-r{animation:slR .24s cubic-bezier(.2,.8,.2,1)}
.exbody.from-l{animation:slL .24s cubic-bezier(.2,.8,.2,1)}
@keyframes slR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.ph-img{aspect-ratio:2/1;border:1.5px dashed #C9CED6;border-radius:12px;background:#F7F8FA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8A9099;font-size:12px;margin:10px 0 12px;text-align:center;padding:12px}
.ph-img svg{width:28px;height:28px;color:#B4BAC3}
.ph-img b{font-weight:500;color:var(--ink-3)}
.extitle{font-size:16px;font-weight:600;margin:0 0 4px;color:var(--ink)}
.exdesc{font-size:13px;color:var(--ink-2);margin:0;line-height:1.7}
.exsteps{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.exsteps li{display:flex;gap:8px;align-items:flex-start}
.exsteps .no{flex:none;width:18px;height:18px;border-radius:50%;background:var(--accent-bg);color:var(--accent-ink);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px}
.exask{margin-top:10px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.exask button{border:none;background:#F2F4F7;color:var(--ink);font-size:12px;padding:3px 10px;border-radius:6px}
.exask button:hover{background:var(--accent-bg);color:var(--accent-ink)}
.exfoot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #F0F1F3}
.dots{display:flex;align-items:center}
.dots button{width:20px;height:20px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.dots button::after{content:"";display:block;width:6px;height:6px;border-radius:3px;background:#D5D9DF;transition:width .2s,background .2s}
.dots button.on::after{width:16px;background:var(--accent)}
.navb{width:32px;height:32px;border-radius:50%;border:1px solid #E1E3E7;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.navb:hover{border-color:var(--accent-line);color:var(--accent-ink)}
.navb[aria-disabled="true"]{opacity:.35;cursor:default}
.navb svg{width:16px;height:16px}
.exfoot .sp{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>AI 填写 · 全场景交互 Demo（第三版 · 简约对话框）</h1>
  <p>一个输入框 + 优化提示词 + 上传文件；「猜你想要」点一下就提问，「探索一下」看使用说明；表格上可拖动框选</p>
  <span class="demo-tag">演示：生成内容为预置；序号、计算、拆分、替换、查重、排序为真实计算</span>
</header>

<div class="layout">
  <nav class="scen" id="scen" aria-label="用户场景"></nav>

  <main class="win" aria-label="模拟 WPS 文字窗口">
    <div class="tabs" aria-hidden="true">
      <span class="tab">WPS Office</span>
      <span class="tab on"><span class="w">W</span><span id="tabname">文字文稿1</span></span>
    </div>
    <div class="menu" aria-hidden="true">
      <span>文件</span><span>开始</span><span>插入</span><span>页面</span><span>引用</span><span>审阅</span><span>视图</span><span class="on">表格工具</span><span>表格样式</span><span>WPS AI</span>
    </div>
    <div class="ribbon">
      <span class="rb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M9 4v16"/></svg>表格属性</span>
      <span class="rb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="12" rx="1.5"/><path d="M14 20l6-6-2-2-6 6v2z"/></svg>绘制表格</span>
      <span class="rb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M9 10l6 6M15 10l-6 6"/></svg>删除</span>
      <span class="rb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 9v6M9 12h6"/></svg>插入</span>
      <span class="sep" aria-hidden="true"></span>
      <span class="rb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 12h10M14 9l3 3-3 3M10 9l-3 3 3 3"/></svg>合并单元格</span>
      <span class="rb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 10h18M10 4v16M16 14l2 2 3-4"/></svg>AI 美化表格</span>
      <span class="sep" aria-hidden="true"></span>
      <div class="aibtn-wrap">

function lessonRun(st, len, onlySet, topic){

    if (onlySet && !onlySet.has(ri + ',' + ci)) return;

    let t = len === '简要' ? v[2] : v[0];
    if (len === '详细' && v[3]) t = v[0] + v[3];
    c.t = t; c.p = true; c.alts = [t, v[1]]; c.ai = 0;
  }));
  const notes = ['AI 撰写的成品内容（篇幅：' + len + '），每一栏都可以单独「换一版」'];
  if (topic && !/春/.test(topic)) notes.push('演示中撰写内容为预置（《春》），真实产品会按你写的课题生成');
  return {grid: g, notes};
}

          cls.push('pv');
          if (c.old != null && c.old !== c.t) old = '<span class="old">' + esc(c.old) + '</span>';
          if (c.alts && st.phase === 'preview') swap = '<button class="swap" data-act="swap" data-r="' + ri + '" data-c="' + ci + '">换一版</button>';
        }
      } else if (!showPv && selSet.has(ri + ',' + ci)) cls.push('sel');
      if (st.phase === 'applied' && st.flash && c.wasP) cls.push('just');
      let srcAttr = '';
      if (showPv && c.src && cls.includes('pv')) srcAttr = ' data-src="' + c.src + '" title="' + (c.src.indexOf('img') === 0 ? '来自图片第 ' + (+c.src.slice(3) + 1) + ' 行' : '悬停查看原文出处') + '"';
      h += '<td data-r="' + ri + '" data-c="' + ci + '"' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + (c.cs > 1 ? ' colspan="' + c.cs + '"' : '') + srcAttr + '>' + old + txt + swap + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  if (firstEmpty >= 0){
    const n = g.filter(r => r[0].k !== 'h' && isEmptyRow(r)).length;
    h += '<button class="inhint" id="inhint" data-act="inline-gen">' + SPARK + '按上面格式补全剩下 ' + n + ' 行</button>';
  }
  return h;
}
function statusHTML(){
  const st = S[cur];
  if (st.err) return '<div class="stat e" role="alert">' + esc(st.err) + '</div>';
  if (st.info) return '<div class="stat i" role="status"><span class="grow">' + esc(st.info.msg) + '</span>' + (st.info.act ? '<button class="sbtn" data-act="infoact" data-k="' + st.info.act.k + '">' + esc(st.info.act.label) + '</button>' : '') + '</div>';
  if (st.route) return '<div class="stat w"><span class="grow">「' + esc(st.route) + '」是排版需求，用「AI 美化表格」更合适' + (st.routeMsg ? '<span class="sub">' + esc(st.routeMsg) + '</span>' : '') + '</span><button class="sbtn" data-act="route">打开 AI 美化表格</button></div>';
  if (st.phase === 'gen'){
    const pct = st.total ? Math.round(st.shown / st.total * 100) : 0;
    return '<div class="stat" role="status"><span class="grow">正在生成预览… ' + st.shown + ' / ' + st.total + '</span><span class="bar"><i style="width:' + pct + '%"></i></span></div>';
  }
  if (st.phase === 'preview'){
    const notes = (st.preview.notes || []).map(n => '<span class="sub">' + esc(n) + '</span>').join('');
    return '<div class="stat"><span class="grow">预览已生成：' + st.total + ' 个单元格（蓝色），确认后才会写入' + notes + '</span><button class="sbtn pri" data-act="apply">采用</button><button class="sbtn" data-act="regen">重新生成</button><button class="lnk" data-act="discard">放弃</button></div>';
  }
  if (st.phase === 'applied'){
    return '<div class="stat ok" role="status"><span class="grow">' + esc(st.applied.msg) + (st.applied.note ? '<span class="sub">' + esc(st.applied.note) + '</span>' : '') + (st.applied.instant ? '<span class="sub">确定性操作，已直接写入</span>' : '') + '</span><button class="sbtn" data-act="undo">撤销</button></div>';
  }
  return '';
}
function dialogHTML(){
  const st = S[cur], sc = SC[cur];
  if (!st.open) return '';
  const cells = selCells(st), busy = st.phase === 'gen';
  let pills = '';
  if (cells.length) pills += '<span class="pill selp"><span class="nm">已选中 ' + esc(selDesc(cells)) + '</span><button data-act="clearsel" aria-label="移除选区">' + XS + '</button></span>';
  st.files.forEach((f, i) => { pills += '<span class="pill">' + (f.url ? '<img src="' + f.url + '" alt="">' : I_FILE) + '<span class="nm">' + esc(f.name) + '</span><button data-act="rmfile" data-k="' + i + '" aria-label="移除附件 ' + esc(f.name) + '">' + XS + '</button></span>'; });
  let h = '<div class="dlg-wrap" id="dlgwrap"><div class="dlg" id="dlg">';
  if (pills) h += '<div class="pills">' + pills + '</div>';
  h += '<label class="sr-only" for="ask">向 AI 填写提问</label><textarea id="ask" rows="2" placeholder="输入问题，或从下方场景提问"' + (busy ? ' readonly' : '') + '>' + esc(st.text) + '</textarea>';
  h += '<div class="tools">';
  h += '<button class="ib' + (st.optBusy ? ' busy' : '') + '" data-act="optimize" aria-label="优化提示词">' + I_OPT + '<span class="tt">' + (st.optBusy ? '优化中…' : '优化提示词') + '</span></button>';
  h += '<button class="ib" data-act="upload" aria-label="上传文件或图片">' + I_ADD + '<span class="tt">上传文件或图片</span></button>';
  if (st.files.length) h += '<span class="cnt">' + st.files.length + '/3</span>';
  const has = st.text.trim().length > 0;
  h += busy ? '<button class="send stop" data-act="stop" aria-label="停止生成">' + I_STOP + '</button>' : '<button class="send' + (has ? ' on' : '') + '" data-act="send" aria-label="发送">' + I_SEND + '</button>';
  h += '</div></div>';
  if (st.optPrev != null) h += '<div class="optnote">已根据当前表格优化提示词<button class="lnk" data-act="optundo">恢复原文</button></div>';
  h += statusHTML();
  if (!busy && st.phase !== 'preview'){
    if (st.ex){ h += exploreHTML(); st.ex.anim = false; st.ex.dir = ''; return h + '</div>'; }
    h += '<div class="sugg"><p class="lb">猜你想要</p><div class="row">';
    FIXED.forEach((label, i) => { h += '<button data-act="chip" data-k="' + i + '">' + SPARK + esc(label) + '</button>'; });
    h += '<button class="ex" data-act="explore" aria-expanded="false">' + I_COMPASS + '探索一下</button>';
    h += '</div></div>';
  }
  return h + '</div>';
}
function renderDoc(){
  const sc = SC[cur], st = S[cur];
  let h = sc.body;
  if (sc.inline && !st.open){ const ih = sc.inline(st); if (ih) h += '<div class="topchip">' + ih + '</div>'; }
  h += '<div class="tblwrap" id="tblwrap">' + tableHTML() + '</div>' + dialogHTML();
  const ae = document.activeElement, aid = ae && ae.id;
  let s0, s1; try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch(e){}
  $('#page').innerHTML = h;
  if (aid === 'ask'){ const el = document.getElementById('ask'); if (el){ el.focus(); try { el.setSelectionRange(s0, s1); } catch(e){} } }
  autosize(); placeHint();
  if (st.flash) setTimeout(() => { st.flash = false; }, 1500);
}
function autosize(){ const t = document.getElementById('ask'); if (t){ t.style.height = 'auto'; t.style.height = Math.max(52, t.scrollHeight) + 'px'; } }
function placeHint(){ const b = document.getElementById('inhint'), tr = document.querySelector('tr[data-first-empty]'); if (b && tr){ b.style.top = tr.offsetTop + 'px'; b.style.height = tr.offsetHeight + 'px'; } }
function renderScen(){
  let h = '', n = 0;
  ORDER.forEach(([g, share, ids]) => {
    h += '<h2><span>' + g + '</span><em>' + share + '</em></h2>';
    ids.forEach(id => { n++; h += '<button data-act="scen" data-k="' + id + '" aria-current="' + (id === cur) + '"><span class="n">' + n + '</span>' + SC[id].label + '</button>'; });
  });
  $('#scen').innerHTML = h + '<p class="src-note">分组依据真实用户提问的分类</p>';
}
function renderNotes(){
  const sc = SC[cur], st = S[cur];
  const idx = !st.open ? 0 : {idle: 1, gen: 2, preview: 3, applied: 4}[st.phase];
  const instant = st.phase === 'applied' && st.applied && st.applied.instant;
  let h = '<h2>这一屏的设计</h2><div class="steps" aria-label="当前所处步骤">';
  ['入口','提问','生成中','预览','已写入'].forEach((s, i) => {
    const cls = instant && (i === 2 || i === 3) ? 'skip' : i < idx ? 'done' : i === idx ? 'cur' : '';
    h += '<span class="' + cls + '"' + (i === idx ? ' aria-current="step"' : '') + '>' + s + '</span>';
  });
  h += '</div><dl><dt>对应 query 类型</dt><dd>' + esc(sc.notes.scene) + '</dd><dt>用户在说什么</dt><dd>' + esc(sc.notes.pain) + '</dd></dl><ol>';
  sc.notes.pts.forEach(p => { h += '<li>' + esc(p[0]) + (p[1] ? '<span class="why">' + esc(p[1]) + '</span>' : '') + '</li>'; });
  h += '</ol><button class="reset" data-act="reset">重置本场景</button>';
  $('#notes').innerHTML = h;
}
function render(){
  const sc = SC[cur], st = S[cur];
  $('#tabname').textContent = sc.doc;
  $('#tip').innerHTML = '<b>AI 填写</b>' + esc(sc.tip);
  $('#aibtn').setAttribute('aria-expanded', String(st.open));
  renderScen(); renderDoc(); renderNotes();
}
function focusSel(sel){ setTimeout(() => { const el = document.querySelector(sel); if (el) el.focus({preventScroll: true}); }, 30); }
function openDlg(){
  const st = S[cur];
  if (!st.open){ st.open = true; st.phase = 'idle'; st.err = ''; render(); }
  const w = document.getElementById('dlgwrap'), d = document.getElementById('dlg');
  if (w) w.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  if (d){ d.classList.remove('pulse'); void d.offsetWidth; d.classList.add('pulse'); }
  focusSel('#ask');
}
function closeDlg(){ const st = S[cur]; clearInterval(st.timer); st.open = false; st.phase = 'idle'; st.err = ''; st.route = null; render(); }
function switchTo(k){ const st = S[cur]; clearInterval(st.timer); if (st.phase === 'gen') st.phase = 'idle'; cur = k; try { history.replaceState(null, '', '#' + k); } catch(_){} render(); }
function addFile(f){
  const st = S[cur];
  if (st.files.length >= 3){ st.err = '最多添加 3 个附件'; render(); return; }
  if (/^image\//.test(f.type)){ const rd = new FileReader(); rd.onload = () => { st.files.push({name: f.name || '粘贴的截图.png', kind: 'image', url: rd.result}); st.err = ''; render(); }; rd.readAsDataURL(f); }
  else if (/\.(txt|csv)$/i.test(f.name)){ const rd = new FileReader(); rd.onload = () => { st.files.push({name: f.name, kind: 'text', text: String(rd.result || '')}); st.err = ''; render(); }; rd.readAsText(f); }
  else if (/\.(pdf|docx?|xlsx?)$/i.test(f.name)){ st.files.push({name: f.name, kind: 'doc'}); st.err = ''; render(); }
  else { st.err = '支持图片、PDF、Word、Excel、txt、csv'; render(); }
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = b.dataset.k, st = S[cur], sc = SC[cur];
  switch (act){
    case 'scen': switchTo(k); break;
    case 'open': openDlg(); break;
    case 'send': st.ex = null; ask(st.text, true); break;
    case 'stop': clearInterval(st.timer); st.phase = 'idle'; render(); focusSel('#ask'); break;
    case 'chip': runChip(+k); break;
    case 'explore': openExplore(); break;
    case 'exclose': closeExplore(null, true); break;
    case 'exprev': goExplore(st.ex.i - 1); break;
    case 'exnext': if (st.ex.i === EX.length - 1){ st.exLast = 0; closeExplore(null, true); } else goExplore(st.ex.i + 1); break;
    case 'exgo': goExplore(+k); break;
    case 'extry': { const i = +k; st.exLast = i; closeExplore(() => runChip(EX[i].chip)); break; }
    case 'exask': { const i = +k; st.exLast = i; closeExplore(() => { st.text = EX[i].ask; st.optPrev = null; render(); const ta = document.getElementById('ask'); if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }); break; }
    case 'infoact': if (k === 'demo'){ if (!st.files.some(f => f.url === RECEIPT)) st.files.push({name: '示例小票.png', kind: 'image', url: RECEIPT}); ask('根据上传的小票图片填写采购清单'); } break;
    case 'quick': { st.open = true; ask(sc.opt(st)); break; }
    case 'inline-gen': { runChip(3); setTimeout(() => { const w = document.getElementById('dlgwrap'); if (w) w.scrollIntoView({block: 'nearest', behavior: 'smooth'}); }, 50); break; }
    case 'selcol': st.sel = {r0: 1, c0: 0, r1: st.grid.length - 1, c1: 0}; openDlg(); render(); break;
    case 'clearsel': st.sel = null; render(); focusSel('#ask'); break;
    case 'optimize': optimize(); break;
    case 'optundo': if (st.optPrev != null){ st.text = st.optPrev; st.optPrev = null; render(); focusSel('#ask'); } break;
    case 'upload': $('#filein').value = ''; $('#filein').click(); break;
    case 'rmfile': st.files.splice(+k, 1); render(); break;
    case 'route': st.routeMsg = '演示：真实产品会打开「AI 美化表格」，并带上你的描述'; render(); break;
    case 'swap': { const c = st.preview.grid[+b.dataset.r][+b.dataset.c]; c.ai = 1 - c.ai; c.t = c.alts[c.ai]; renderDoc(); break; }
    case 'apply':
      st.snapshot = clone(st.grid);
      st.grid = st.preview.grid.map(r => r.map(c => ({t: c.t, k: c.k, cs: c.cs, wasP: !!c.p})));
      st.phase = 'applied'; st.applied = {msg: '已写入 ' + st.total + ' 个单元格', instant: false}; st.flash = true; st.sel = null;
      render(); focusSel('[data-act="undo"]'); break;
    case 'undo': st.grid = st.snapshot; st.phase = 'idle'; render(); focusSel('#ask'); break;
    case 'regen': ask(st.last, true); break;
    case 'discard': st.phase = 'idle'; render(); focusSel('#ask'); break;
    case 'reset': clearInterval(st.timer); init(cur); render(); break;
  }
});
$('#aibtn').addEventListener('click', () => { if (S[cur].open && S[cur].phase !== 'gen') closeDlg(); else openDlg(); });
$('#filein').addEventListener('change', e => { [...(e.target.files || [])].forEach(addFile); });
document.addEventListener('input', e => {
  if (e.target.id !== 'ask') return;
  const st = S[cur]; st.text = e.target.value; st.optPrev = null; autosize();
  if (st.info && !/^把以下内容/.test(st.text)){ st.info = null; const inf = document.querySelector('.stat.i'); if (inf) inf.remove(); }
  const sb = document.querySelector('.send'); if (sb && !sb.classList.contains('stop')) sb.classList.toggle('on', st.text.trim().length > 0);
  if (st.err){ st.err = ''; const er = document.querySelector('.stat.e'); if (er) er.remove(); }
  const on = document.querySelector('.optnote'); if (on) on.remove();
});
document.addEventListener('keydown', e => {
  const st = S[cur];
  if (st.ex && e.target.closest && e.target.closest('#explore')){
    if (e.key === 'ArrowRight'){ e.preventDefault(); goExplore(st.ex.i + 1); return; }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); goExplore(st.ex.i - 1); return; }
    if (e.key === 'Escape'){ e.preventDefault(); closeExplore(null, true); return; }
  }
  if (e.key === 'Escape'){
    if (st.sel && !(e.target.id === 'ask')){ st.sel = null; render(); return; }
    if (st.open && e.target.closest && e.target.closest('#dlgwrap')){ e.preventDefault(); closeDlg(); $('#aibtn').focus(); }
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.id === 'ask' && st.phase !== 'gen'){ e.preventDefault(); ask(st.text, true); }
});
document.addEventListener('paste', e => {
  if (!S[cur].open || !e.target.closest || !e.target.closest('#dlgwrap')) return;
  const fl = e.clipboardData && e.clipboardData.files;
  if (fl && fl.length && /^image\//.test(fl[0].type)){ e.preventDefault(); addFile(fl[0]); }
});
/* 框选 */
document.addEventListener('mousedown', e => {
  const st = S[cur];
  const td = e.target.closest && e.target.closest('#tblwrap td[data-r]');
  if (td && !e.target.closest('button') && st.phase !== 'gen' && st.phase !== 'preview' && !SC[cur].noSel){
    if (st.phase === 'applied') st.phase = 'idle';
    const r = +td.dataset.r, c = +td.dataset.c;
    if (r === 0 && st.grid[0][c] && st.grid[0][c].k === 'h') st.sel = {r0: 1, c0: c, r1: st.grid.length - 1, c1: c};
    else st.sel = {r0: r, c0: c, r1: r, c1: c};
    drag = true; e.preventDefault(); render(); return;
  }
  if (st.sel && !e.target.closest('#dlgwrap, .aibtn-wrap, .topchip, #tblwrap')){ st.sel = null; render(); }
});
document.addEventListener('mouseover', e => {
  const t = e.target;
  if (drag){
    const td = t.closest && t.closest('#tblwrap td[data-r]'), st = S[cur];
    if (td && st.sel){ const r = +td.dataset.r, c = +td.dataset.c; if (r !== st.sel.r1 || c !== st.sel.c1){ st.sel.r1 = Math.max(SC[cur].lesson ? 0 : 1, r); st.sel.c1 = c; renderDoc(); } }
    return;
  }
  document.querySelectorAll('.src.hl').forEach(x => x.classList.remove('hl'));
  const td = t.closest && t.closest('td[data-src]'); if (!td) return;
  td.parentElement.querySelectorAll('td[data-src]').forEach(c => { const m = document.getElementById('m-' + c.dataset.src); if (m) m.classList.add('hl'); });
});
document.addEventListener('mouseup', () => { if (drag){ drag = false; const st = S[cur]; if (selCells(st).length && !st.open){ st.open = true; st.phase = 'idle'; } render(); } });
window.addEventListener('resize', placeHint);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SC[h] && h !== cur){ cur = h; render(); } });
render();
})();
</script>
</body>
</html>
